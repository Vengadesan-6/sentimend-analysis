services:
  - type: web
    name: sentimend-analysis
    env: python
    buildCommand: pip install -r backend/requirements.txt && python -m ml.preload
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 75
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://sentimend-analysis.vercel.app"]'
      - key: MONGODB_URL
        value: '' # Optional: Add MongoDB Atlas connection string from dashboard
      - key: DATABASE_NAME
        value: sentiment_platform
