services:
  - type: web
    name: sentix-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["https://your-frontend-app.vercel.app"]' # TODO: Update with your Vercel URL
      - key: MONGODB_URL
        value: '' # TODO: Add from dashboard
      - key: DATABASE_NAME
        value: sentiment_platform
